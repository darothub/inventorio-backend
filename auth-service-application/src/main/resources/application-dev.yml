spring:
  datasource:
    url: jdbc:postgresql://postgres-user:5432/user_db
    username: admin
    password: admin
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

resilience4j:
  ratelimiter:
    instances:
      myRateLimiter:
        limit-for-period: 5          # Allow 5 requests
        limit-refresh-period: 10s    # Time window: 10 seconds
        timeout-duration: 1s