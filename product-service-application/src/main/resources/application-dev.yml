spring:
  datasource:
    url: jdbc:postgresql://postgres-product:5432/product_db
    username: admin
    password: admin
    hikari:
      maximum-pool-size: 5
      max-lifetime: 10000  # 10 seconds
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
